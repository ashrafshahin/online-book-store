<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Book Store - Create an Account</title>
    <style>
        /* CSS STYLING */
        :root {
            --primary-color: #5c3d2e;
            /* Deep bookish brown */
            --secondary-color: #865439;
            /* Warm leather brown */
            --bg-color: #f4efe8;
            /* Soft paper color */
            --text-color: #2d2424;
            /* Dark ink color */
            --error-color: #b83b5e;
            /* Deep red for errors */
            --success-color: #2b7a78;
            /* Muted teal for success */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h2 {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .form-control {
            margin-bottom: 20px;
            position: relative;
        }

        .form-control label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: var(--primary-color);
        }

        .form-control input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            transition: border-color 0.3s ease;
            outline: none;
        }

        .form-control input:focus {
            border-color: var(--secondary-color);
        }

        /* Validation UI Classes */
        .form-control.success input {
            border-color: var(--success-color);
        }

        .form-control.error input {
            border-color: var(--error-color);
        }

        .form-control small {
            color: var(--error-color);
            position: absolute;
            bottom: -18px;
            left: 0;
            font-size: 12px;
            visibility: hidden;
        }

        .form-control.error small {
            visibility: visible;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: var(--secondary-color);
        }

        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .footer-text a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- <link rel="stylesheet" href="./css/bootstrap.min.css"> -->
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div class="container">
        <button class="btn btn-primary"><a href="./index.html" class="nav-brand"><i class="fa-solid fa-book-open"></i>📚 Home Page
            </a></button>
        <div class="header">
            
            <h2>Online Book Store</h2>
            <p>Join our community of readers</p>
        </div>

        <!-- HTML FORM -->
        <form id="registrationForm" novalidate>
            <!-- Full Name -->
            <div class="form-control">
                <label for="username">Full Name</label>
                <input type="text" id="username" placeholder="Enter your full name">
                <small>Error message</small>
            </div>

            <!-- Email -->
            <div class="form-control">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com">
                <small>Error message</small>
            </div>

            <!-- Password -->
            <div class="form-control">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters">
                <small>Error message</small>
            </div>

            <!-- Confirm Password -->
            <div class="form-control">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Re-enter your password">
                <small>Error message</small>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit">Create Account</button>

            <div class="footer-text">
                Already have an account? <a href="./login.html">Log In</a>
            </div>
        </form>
    </div>

    
    
    
    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/popper.min.js"></script>
    <script src="./js/bootstrap.min.js"></script>
    <script src="./js/script.js"></script>

    <!-- JAVASCRIPT VALIDATION -->
    <script>
        const form = document.getElementById('registrationForm');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');

        // Form Submit Event Listener
        form.addEventListener('submit', function (e) {
            e.preventDefault(); // Stop standard form refresh

            if (validateInputs()) {
                alert('Success! Your bookstore account has been simulated.');
                form.reset();
                clearValidationClasses();
            }
        });

        // Validation Logic Function
        function validateInputs() {
            const usernameVal = username.value.trim();
            const emailVal = email.value.trim();
            const passwordVal = password.value.trim();
            const confirmPasswordVal = confirmPassword.value.trim();

            let isFormValid = true;

            // Username Validation (Checks empty status)
            if (usernameVal === '') {
                setError(username, 'Name cannot be blank');
                isFormValid = false;
            } else {
                setSuccess(username);
            }

            // Email Validation (Checks syntax pattern)
            if (emailVal === '') {
                setError(email, 'Email cannot be blank');
                isFormValid = false;
            } else if (!isValidEmail(emailVal)) {
                setError(email, 'Provide a valid email address');
                isFormValid = false;
            } else {
                setSuccess(email);
            }

            // Password Validation (Checks length restriction)
            if (passwordVal === '') {
                setError(password, 'Password cannot be blank');
                isFormValid = false;
            } else if (passwordVal.length < 6) {
                setError(password, 'Password must be at least 6 characters');
                isFormValid = false;
            } else {
                setSuccess(password);
            }

            // Confirm Password Validation (Checks parity verification)
            if (confirmPasswordVal === '') {
                setError(confirmPassword, 'Please confirm your password');
                isFormValid = false;
            } else if (confirmPasswordVal !== passwordVal) {
                setError(confirmPassword, 'Passwords do not match');
                isFormValid = false;
            } else {
                setSuccess(confirmPassword);
            }

            return isFormValid;
        }

        // Helper: Inject Error state
        function setError(input, message) {
            const formControl = input.parentElement;
            const small = formControl.querySelector('small');
            formControl.className = 'form-control error';
            small.innerText = message;
        }

        // Helper: Inject Success state
        function setSuccess(input) {
            const formControl = input.parentElement;
            formControl.className = 'form-control success';
        }

        // Helper: Regular Expression string syntax check
        function isValidEmail(email) {
            const re = /^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-35-91-9]{1,3}\.[0-35-91-9]{1,3}\.[0-35-91-9]{1,3}\.[0-35-91-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
            return re.test(String(email).toLowerCase());
        }

        // Helper: Clear visual wrappers on successfully submitted form
        function clearValidationClasses() {
            const controls = document.querySelectorAll('.form-control');
            controls.forEach(control => {
                control.classList.remove('success', 'error');
            });
        }
    </script>
</body>

</html>
