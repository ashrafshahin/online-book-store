<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore User Dashboard</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        aside {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 2rem;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .nav-links button {
            width: 100%;
            background: none;
            border: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-muted);
            border-radius: 0.375rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .nav-links button:hover,
        .nav-links button.active {
            background-color: #eef2ff;
            color: var(--primary);
        }

        .nav-links button.logout-btn {
            color: var(--danger);
        }

        .nav-links button.logout-btn:hover {
            background-color: #fef2f2;
        }

        /* Main Content Area */
        main {
            flex-grow: 1;
            padding: 2.5rem;
            overflow-y: auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        h2 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }

        /* Profile Card Form */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 2rem;
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 0.95rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-submit {
            background-color: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.375rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: var(--primary-dark);
        }

        /* Order History Table */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            overflow: hidden;
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background-color: #f9fafb;
            font-weight: 600;
        }

        .badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.delivered {
            background-color: #d1fae5;
            color: var(--success);
        }

        .badge.processing {
            background-color: #fef3c7;
            color: #d97706;
        }

        /* Responsive */
        @media(max-width: 768px) {
            body {
                flex-direction: column;
            }

            aside {
                width: 100%;
                padding: 1rem;
            }

            main {
                padding: 1rem;
            }

            .nav-links {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .nav-links button {
                width: auto;
                flex-grow: 1;
            }
        }
    </style>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <!-- Sidebar Navigation -->
    <aside>
        <div>
            <div class="brand">📚 Reader's Den</div>
            <ul class="nav-links">
                <li><button class="active" onclick="switchTab(event, 'profile-tab')">Edit Profile</button></li>
                <li><button onclick="switchTab(event, 'orders-tab')">Order History</button></li>
                <li><button class="logout-btn" onclick="handleLogout()">Logout</button></li>
            </ul>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">Logged in as: Alex</div>
        <p class="btn btn-primary"><a href="./index.html" class="nav-brand"><i class="fa-solid fa-book-open"></i> 📚 Home
            </a></p>
    </aside>

    <!-- Main Content Area -->
    <main>
        <!-- Edit Profile Tab -->
        <section id="profile-tab" class="tab-content active">
            <h2>Account Settings</h2>
            <div class="card">
                <form id="profile-form" onsubmit="updateProfile(event)">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" value="Alex Johnson" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" value="alex.j@example.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" value="+1 (555) 019-2834">
                    </div>
                    <button type="submit" class="btn-submit">Save Changes</button>
                </form>
            </div>
        </section>

        <!-- Order History Tab -->
        <section id="orders-tab" class="tab-content">
            <h2>Order History</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Book Titles</th>
                        <th>Date</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#BK-9821</td>
                        <td>The Great Gatsby, 1984</td>
                        <td>Aug 02, 2026</td>
                        <td>$34.50</td>
                        <td><span class="badge delivered">Delivered</span></td>
                    </tr>
                    <tr>
                        <td>#BK-9543</td>
                        <td>Atomic Habits</td>
                        <td>Jul 19, 2026</td>
                        <td>$16.00</td>
                        <td><span class="badge processing">Processing</span></td>
                    </tr>
                </tbody>
            </table>
        </section>
        
    </main>

    <!-- JavaScript Interactivity -->
    <script>
        function switchTab(evt, tabId) {
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(c => c.classList.remove('active'));

            const buttons = document.querySelectorAll('.nav-links button');
            buttons.forEach(b => b.classList.remove('active'));

            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function updateProfile(event) {
            event.preventDefault();
            alert('Profile details updated successfully!');
        }

        function handleLogout() {
            if (confirm('Are you sure you want to log out?')) {
                // Redirect logic or clearing session state
                alert('Logged out successfully!');
                window.location.reload();
            }
        }
    </script>
</body>

</html>
